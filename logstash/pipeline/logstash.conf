input {
  file {
    path => "/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}
filter {
  if [level] {
    mutate { lowercase => [ "level" ] }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "lab3-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
